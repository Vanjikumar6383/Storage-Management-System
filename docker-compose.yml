version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storage_optimizer_db
    environment:
      POSTGRES_DB: storage_optimizer_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage_optimizer_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage_optimizer_backend
    environment:
      - APP_ENV=DEMO
      - STORAGE_PROVIDER=LOCAL_S3_COMPATIBLE
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/storage_optimizer_dev
      - S3_ENDPOINT_URL=http://localhost:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: storage_optimizer_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
    driver: local
